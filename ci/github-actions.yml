name: CPU tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test,experiments]' ruff==0.14.1
      - run: ruff check src scripts tests
      - run: python -m compileall -q src scripts experiments/paper
      - run: pytest -q
        env:
          HF_HUB_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
