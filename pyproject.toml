[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-lora"
version = "0.1.0"
description = "Direction-regularized LoRA for low-resource behavioral control"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24",
  "tqdm>=4.66",
  "torch>=2.6,<3",
  "transformers>=4.51.3,<4.52",
  "huggingface-hub>=0.30,<1.0",
  "peft>=0.15.2,<0.16",
  "accelerate>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "scipy>=1.10"]
experiments = ["scipy>=1.10", "matplotlib>=3.7", "datasets>=3,<4", "requests>=2.31"]

[project.urls]
Repository = "https://github.com/ykzhang721/PR-LoRA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments/paper"]
